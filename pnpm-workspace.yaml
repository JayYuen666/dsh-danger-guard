# esbuild 由 vite 传递引入，其安装脚本负责落下当前平台的二进制；本仓没有包直接依赖它。
# koffi 是 @deepseek-ai/dsh-fs-local 的直接依赖（真 spine 那两层测试要真 FsLocal 才装它），
# 而 dsh-fs-local 的 win32 后端面（GetFileSecurityW / SetFileSecurityW / ReplaceFileW；官方
# 模块注释原话 "non-Windows processes never open Win32 libraries"）经它懒加载——那支要能跑，
# koffi 的安装脚本就得落出当前平台的原生格。两枚都显式放行：pnpm 12 对"没做过决定"的依赖
# 直接 ERR_PNPM_IGNORED_BUILDS，装依赖这一步就失败（发布流程卡在这里）。
allowBuilds:
  esbuild: true
  koffi: true
# 发布冷却刻意为 0：内部 @jayyuen66/* 与宿主族 rc 包必须发布后即时可装；第三方新版的供应链
# 缓冲由 catalog 与 overrides 的精确钉版承担，不靠时间窗。
minimumReleaseAge: 0
