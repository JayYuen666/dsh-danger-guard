# actionlint 的按文件豁免。ci.yml 的那一步用 `-config-file` 显式指向本文件，不依赖默认发现：
# 配置文件缺失或改名会以一条报错暴露，而不是让豁免静默失效。
#
# 为什么需要这一层：命令行上的 `-ignore` 是**全局**正则，而那一步一次传入
# `.github/workflows/*.yml` 的全部工作流——在一处写 `-ignore 'SC2016'`，这条规则就在所有
# 被传入的文件里一起关掉，豁免一处等于豁免全部。`paths` 段按文件收窄，豁免只落在写它的那一份上。
#
# 为什么只有 ci.yml：它的探测这一步刻意用单引号包住一段 JS（脚本体里有 JS 模板串，交给 shell
# 展开就坏了），shellcheck 对「单引号里出现 $」报 SC2016，是误报。其余三份工作流里如果真出现
# 「单引号里写 $VAR 以为是变量」的实错，仍然要能抓到。
#
# 已知残差：actionlint 的配置只能按文件收窄，这条豁免覆盖整份 ci.yml，而不是只覆盖探针那一步。
# 探测脚本之外若新增「单引号里写 $VAR」的实错，需要人工读出来；新增探测脚本应复用同一段脚本体，
# 不要另起一处单引号构造。
paths:
  .github/workflows/ci.yml:
    ignore:
      - "SC2016"
