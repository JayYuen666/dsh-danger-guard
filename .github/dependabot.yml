# 依赖更新：action 一条线。
#
# action 侧覆盖本仓的全部 workflow 引用：这些引用都钉了 commit SHA，Dependabot 提的 PR
# 会把「换了哪个提交」变成一次可评审的 diff。
#
# 这里刻意**没有** npm 更新块：本仓依赖分三类，三类都不该由更新机器人改动。
# 一是工具链与大部分宿主依赖写成 catalog:，那条范围的真源在伞根的 pnpm-workspace.yaml；
# 二是其余宿主依赖写成字面版本，每一枚都在本仓 pnpm-workspace.yaml 的 overrides 里被钉死
# （宿主族统一 0.2.1-rc.2 那条线）。Dependabot 对这两类提的 PR 会被 catalog/overrides 解析
# 回原版本，合进去也不改变安装树——留着它只会造出「看起来升了、实际没升」的 PR。
# 三是 react 与 react-dom：它们**不在** overrides 里（只服务于测试与客户端类型面，版本由
# catalog 里的 @types/react 那两条对齐），因此确实是机器人升得动的两枚。仍然不给 npm 更新块：
# 升它们必须与宿主 seed 表里的 react 运行时同版本，本仓单方面跟进会让卡片在宿主里拿到两个
# React 实例（hooks 直接报错）。要升这些版本只能在伞根改真源，再投影下来。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # 本仓引用的 action 全部放进一组，避免每个 action 各占一个 PR 去抢同一个名额。
      # 模式按 `<owner>/<repo>` 写：通配符覆盖该仓库下的全部条目（codeql-action 的 init、
      # analyze、upload-sarif 就是三条不同的引用），跨仓库不会互相匹配，所以两个 owner 各列一条。
      # 补丁与次版本进一组：它们可以一起评审、一起回滚，钉了 SHA 的引用逐条 diff 就够看。
      # 大版本单独一组并**显式**写 update-types —— 不写的话分组会重新收录全部更新类型，组名与
      # 实际内容不符；而跨大版本的破坏性变更还会拖着整组安全补丁一起排队。
      actions:
        patterns:
          - "actions/*"
          - "pnpm/*"
          - "github/codeql-action*"
          - "ossf/scorecard-action*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "actions/*"
          - "pnpm/*"
          - "github/codeql-action*"
          - "ossf/scorecard-action*"
        update-types:
          - "major"
